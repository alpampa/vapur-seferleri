name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Aynı branch'de yeni koşu eskisini iptal eder (kaynak israfı yok)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web — test, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # Monorepo: bağımlılıklar kök lock dosyasından kurulur
      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Unit tests (vitest)
        run: npm test

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

  api:
    name: API — generate, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      # Prisma generate + testler için gereken minimum ortam.
      DATABASE_URL: file:./dev.db
      JWT_ACCESS_SECRET: ci_access_secret
      JWT_REFRESH_SECRET: ci_refresh_secret
      ENABLE_DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Unit tests (jest)
        run: npm test

      - name: Build
        run: npm run build

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Aynı branch'de yeni koşu eskisini iptal eder (kaynak israfı yok)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web — test, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # Monorepo: bağımlılıklar kök lock dosyasından kurulur
      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Unit tests (vitest)
        run: npm test

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
